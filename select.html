<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>原壊：コネクトバトル</title>
    <link rel="stylesheet" href="public/style_settings.css"> <!-- 設定ダイアログのスタイル -->
    <link rel="stylesheet" href="public/style.css?v=1.68.1"> <!-- スタイルシートのリンク -->
    <script type="module" src="public/scripts/characterSelect.js" defer></script>

    <!-- Favicon -->
    <link rel="icon" href="public/scripts/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="16x16" href="public/scripts/favicon_io/favicon-16x16.png">
    <link rel="icon" sizes="32x32" href="public/scripts/favicon_io/favicon-32x32.png">

    <!-- Apple Touch Icon (for iOS) -->
    <link rel="apple-touch-icon" href="public/scripts/favicon_io/apple-touch-icon.png">

    <!-- Android Icons (for Android devices) -->
    <link rel="icon" sizes="192x192" href="public/scripts/favicon_io/android-chrome-192x192.png">
    <link rel="icon" sizes="512x512" href="public/scripts/favicon_io/android-chrome-512x512.png">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-09K6476DPN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-09K6476DPN');
</script>
</head>
<body class="lobby-page">
    <header>
        <h1 data-i18n="pageTitle">原壊：コネクトバトル</h1>
    </header>

    <main>
     <!-- ヘルプボタン -->
    <button id="helpButton" class="help-btn" data-i18n="helpBtn">あそびかた</button>


    <!-- Help Modal -->
    <!-- 挑戦モードの説明 -->
    <div id="challengeInfoModal" class="modal">
      <div class="modal-content challenge-info-content">
        <span class="close" id="challengeInfoClose">&times;</span>
        <h3 id="challengeInfoTitle"></h3>
        <p id="challengeInfoText"></p>
      </div>
    </div>

    <div id="helpModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div class="slider">
          <!-- 左ボタン -->
          <button class="slider-btn prev-btn">&lt;</button>
          <!-- 画像表示エリア -->
          <div class="slider-images">
            <img src="public/font/rule1.png" alt="説明1" class="slide active">
            <img src="public/font/rule2.png" alt="説明2" class="slide">
            <img src="public/font/rule3.png" alt="説明3" class="slide">
            <img src="public/font/rule4.png" alt="説明4" class="slide">
            <img src="public/font/rule5.png" alt="説明5" class="slide">
            <img src="public/font/rule6.png" alt="説明6" class="slide">
            <img src="public/font/rule7.png" alt="説明7" class="slide">
            <img src="public/font/rule8.png" alt="説明8" class="slide">
          </div>
          <!-- 右ボタン -->
          <button class="slider-btn next-btn">&gt;</button>
        </div>
      </div>
    </div>


     <!-- ----------------------------モーダル------------------------------------------- -->

    <!-- ② 縦画面ラベル: transform親の外に配置（position:fixedが正しく効くように） -->
    <div id="orientationLabel"></div>

    <div id="lobbyViewport">
    <div id="lobbyWrap">
    <div class="parent-container"> <!-- 幅を指定した親Div -->

        <div id="matchLabel" class="match-label"></div>

        <div class="container">

            <button id="backToHubButton" class="back-btn" data-i18n="backBtn">← 戻る</button>

            <div class="info-item-yoko lobby-player-info">
                <div class="lobby-player-left">
                    <div class="info-row-no-bg" style="border:none; padding:0;">
                        <div class="label label-even" data-i18n="labelName">名前</div>
                        <input id="playerName" class="value-yoko" type="text" placeholder="プレイヤー名を入力" data-i18n-placeholder="placeholderName" />
                    </div>
                    <div id="lobbyRankAndRate" class="player-rating" style="text-align:left; margin:2px 0;">---</div>
                    <div id="lobbyRanking" class="player-rating-detail" style="text-align:left; margin:2px 0; font-size:14px;"></div>
                    <div id="lobbyTitles" class="player-titles"></div>
                </div>
                <img id="lobbyRankBadge" class="rank-badge" src="" alt="">
            </div>
            <div id="characterInfoLabel" class="info-box top15" data-i18n="charaInfoLabel">▼キャラクター情報▼</div>

            <!-- キャラクター情報を表示するためのテーブル -->
            <div id="characterInfoContainer">
                <div class="info-item-yoko">
                    <div id="characterName" class="value-yoko chara-name-short"></div>
                    <div class="label chara-ct-label" data-i18n="labelCT">CT</div>
                    <div id="characterCharge" class="value-yoko chara-charge-short"></div>
                </div>
                <div class="info-item-tate">
                    <div class="label label-even" data-i18n="labelAbility">必殺技</div>
                    <div id="Ability" class="value-tate"></div>
                    <div id="AbilityDetail" class="value-tate abilityDetail"></div>
                </div>
            </div>
            <!-- 選択したキャラのcharaIDを保持する非表示のフィールド -->
            <input type="hidden" id="charaID" value="">

            <!-- マッチング対戦専用ブロック（?mode=match の場合のみ表示） -->
            <div id="matchModeBlock">
                <button id="matchButton" class="btn" data-i18n="btnMatchStart">マッチング</button>

                <div class="info-item-yoko">
                    <div class="label label-even" data-i18n="labelPassphrase">合言葉</div>
                    <input id="roomMatching" class="value-yoko" type="text" placeholder="合言葉を入力" data-i18n-placeholder="placeholderPassphrase" />
                </div>
            </div>

            <!-- CPU対戦専用ブロック（?mode=cpu の場合のみ表示） -->
            <div id="soloModeBlock">
                <div id="soloModeGroup" class="solo-mode-group">
                    <!-- ◀ ▶ でソロモードと挑戦モード(連勝・万象・逆転)を切り替える。挑戦モードは (i) で説明を表示(2026-10-22) -->
                    <div class="solo-mode-switch">
                        <button type="button" id="soloModePrev" class="solo-mode-arrow" aria-label="prev">◀</button>
                        <button id="soloModeButton" class="btn solo-mode-btn" data-i18n="btnSolo">ソロモード(CPU対戦)</button>
                        <button type="button" id="soloModeInfo" class="solo-mode-info" aria-label="info" hidden>i</button>
                        <button type="button" id="soloModeNext" class="solo-mode-arrow" aria-label="next">▶</button>
                    </div>
                    <div id="challengeStatus" class="challenge-status" hidden></div>

                    <div id="cpuDifficultySelector" class="cpu-difficulty-selector">
                        <div class="cpu-difficulty-radio-row">
                            <label class="cpu-difficulty-radio"><input type="radio" name="cpuDifficulty" value="easy"></label>
                            <span class="cpu-difficulty-line"></span>
                            <label class="cpu-difficulty-radio"><input type="radio" name="cpuDifficulty" value="normal"></label>
                            <span class="cpu-difficulty-line"></span>
                            <label class="cpu-difficulty-radio"><input type="radio" name="cpuDifficulty" value="hard"></label>
                            <span class="cpu-difficulty-line"></span>
                            <label class="cpu-difficulty-radio"><input type="radio" name="cpuDifficulty" value="bakatare"></label>
                        </div>
                        <div id="cpuDifficultyLabel" class="cpu-difficulty-label"></div>
                    </div>

                    <!-- CPUの対戦相手選び：一覧のクリック先を「自分／相手」で切り替える。相手未選択ならランダム -->
                    <div id="cpuOpponentPicker" class="cpu-opponent-picker">
                        <div class="pick-target-toggle">
                            <button type="button" id="pickSelfBtn" class="pick-target-btn pick-self active" data-i18n="pickSelf">自分を選ぶ</button>
                            <button type="button" id="pickOpponentBtn" class="pick-target-btn pick-opponent" data-i18n="pickOpponent">相手を選ぶ</button>
                            <button type="button" id="opponentRandomBtn" class="pick-target-btn pick-random" data-i18n="opponentRandom">おまかせ</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="statusMessage" class="status"></div>

        </div>

        <div class="charalist"> <!-- charalistを追加 -->
            <div class="thumbnail-container" id="thumbnailContainer"></div>
        </div>
    </div><!-- /.parent-container -->
    </div><!-- /#lobbyWrap -->
    </div><!-- /#lobbyViewport -->
    </main>

    <div id="version"></div>

    <footer class="legal-footer">
      © miHoYo / HoYoverse. All rights reserved. Other properties belong to their respective owners.
    </footer>

    <script src="https://uko05.github.io/TopPage00/shared/sidebar.js"></script>
</body>
</html>
